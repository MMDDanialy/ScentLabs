<!doctype html>
<html lang="en" dir="ltr" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Perfume Lab</title>
    <meta name="description" content="Luxury dark-mode perfumery atelier and precision formulation laboratory for composing virtual fragrance accords, analyzing olfactory balance, and exporting Fragrance Identity Passports." />
    <meta property="og:title" content="Virtual Perfume Lab" />
    <meta property="og:description" content="Compose virtual fragrance accords, inspect pyramid balance, and mint a collectible Fragrance Identity Passport." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/virtual_perfume_lab_symbol_transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var savedLocale = localStorage.getItem('vpl_locale');
          var locale = savedLocale === 'fa' ? 'fa' : 'en';
          var dir = locale === 'fa' ? 'rtl' : 'ltr';
          var root = document.documentElement;
          root.lang = locale;
          root.dir = dir;

          var savedTheme = localStorage.getItem('vpl_theme_mode');
          var mode = savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'system' ? savedTheme : 'dark';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;
          if (resolved === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
